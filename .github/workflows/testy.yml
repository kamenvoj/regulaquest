name: Testy

on:
  push:
  pull_request:

jobs:
  testy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalace čtečky PDF
        run: pip install pymupdf
      - name: Testy Studia
        run: python -m unittest discover -s tests -v

  databaze:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install "psycopg[binary]"
      - name: Testy databáze (migrace, pravidla přístupu, odborná pravidla)
        env:
          RQ_PG_DSN: host=localhost port=5432 user=postgres password=postgres
        run: python -m unittest supabase/tests/test_databaze.py -v
