name: Testy

on:
  push:
  pull_request:

jobs:
  testy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalace čtečky PDF
        run: pip install pymupdf
      - name: Testy Studia
        run: python -m unittest discover -s tests -v
